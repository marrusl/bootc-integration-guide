title: bootc Integration Guide
description: >-
  A practical guide for partner integration engineers adapting host RPM
  software for RHEL image mode (bootc).

remote_theme: just-the-docs/just-the-docs@v0.12.0
plugins:
  - jekyll-remote-theme

color_scheme: light
search_enabled: true
search:
  heading_level: 3
  previews: 3
  tokenizer_separator: /[\s/]+/
heading_anchors: true
back_to_top: true
back_to_top_text: "Back to top"

gh_edit_link: true
gh_edit_link_text: "Suggest a change to this page"
gh_edit_repository: https://github.com/marrusl/bootc-integration-guide
gh_edit_branch: main
gh_edit_view_mode: edit

# aux_nav.html reads these values raw, with no relative_url filter, so the
# internal link is spelled out in full rather than site-root-relative.
aux_links:
  "Open questions":
    - "https://marrusl.github.io/bootc-integration-guide/open-questions/"
