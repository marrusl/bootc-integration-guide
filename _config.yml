title: bootc Integration Guide
description: >-
  A practical guide for partner integration engineers adapting host RPM
  software to image mode for RHEL (bootc).

remote_theme: just-the-docs/just-the-docs@v0.12.0
plugins:
  - jekyll-remote-theme

color_scheme: light
search_enabled: true
search:
  heading_level: 3
  previews: 3
  tokenizer_separator: /[\s/]+/
heading_anchors: true
back_to_top: true
back_to_top_text: "Back to top"

gh_edit_link: true
gh_edit_link_text: "Suggest a change to this page"
gh_edit_repository: https://github.com/marrusl/bootc-integration-guide
gh_edit_branch: main
gh_edit_view_mode: edit

# The theme's header renders the auxiliary nav only when aux_links is
# non-empty. What it shows comes from _includes/components/aux_nav.html,
# which overrides the theme and picks links per page so no page links to
# itself. The entries here keep the nav enabled and document the pages.
aux_links:
  "Testing in a VM":
    - "https://marrusl.github.io/bootc-integration-guide/test-vm/"
  "Open questions":
    - "https://marrusl.github.io/bootc-integration-guide/open-questions/"
